spring.application.name=setlistaggregator
#host-assigned port (Render/Cloud Run set PORT)
server.port=${PORT:8080}
#DB credentials come from environment variables on the host
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#jpa, hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

#batch performance customization- trying for faster searches by increasing batch size
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

#connection pool sized for a free-tier serverless Postgres (Neon):
#min-idle 0 lets idle connections close so the database can scale to zero between visits
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

#tomcat tuning for a 512MB free instance
server.tomcat.threads.max=20
server.tomcat.max-connections=100
server.tomcat.accept-count=50
server.tomcat.connection-timeout=15000

#silence SQL statement logs
logging.level.org.hibernate.SQL=off

#silence parameter binding logs like ?
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off

#still want to see warnings/errors if something breaks in Hibernate
logging.level.org.hibernate=warn

#formatting sql
spring.jpa.properties.hibernate.format_sql=true
